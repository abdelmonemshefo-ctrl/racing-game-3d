<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سباق السيارات 3D</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      user-select: none;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#7ec0ee, #cfe9ff);
    }
    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.8);
      z-index: 10;
      pointer-events: none;
    }
    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(10,10,10,0.55);
      z-index: 20;
    }
    #startScreen h1 {
      font-size: 42px;
      margin: 0 0 10px 0;
    }
    #startScreen p {
      margin: 0 0 20px 0;
      font-size: 18px;
      color: #dfefff;
    }
    #startBtn {
      border: none;
      background: #ff3b30;
      color: white;
      font-size: 22px;
      font-weight: bold;
      border-radius: 16px;
      padding: 16px 28px;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(160,20,20,1);
    }
    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 15;
    }
    .btn {
      width: 90px;
      height: 70px;
      border-radius: 18px;
      border: 2px solid rgba(255,255,255,0.7);
      background: rgba(0,0,0,0.35);
      color: white;
      font-size: 36px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>السرعة: <span id="speed">0</span> km/h</div>
    <div>النقاط: <span id="score">0</span></div>
  </div>

  <div id="startScreen">
    <h1>🏎️ سباق السيارات</h1>
    <p>تجنب السيارات وتقدم كلما أمكنك</p>
    <button id="startBtn">ابدأ السباق</button>
  </div>

  <div id="controls">
    <button class="btn" id="leftBtn">◀</button>
    <button class="btn" id="rightBtn">▶</button>
  </div>

  <script>
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    const speedEl = document.getElementById('speed');
    const scoreEl = document.getElementById('score');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');

    let w = 0, h = 0;
    let gameRunning = false;
    let score = 0;
    let speed = 0;
    let roadScroll = 0;
    let laneX = 0;
    let moveDir = 0;
    let lastTime = 0;
    let enemyTimer = 0;

    const player = {
      x: 0,
      y: 0,
      w: 52,
      h: 90,
      color: '#ff3b30'
    };

    const enemies = [];

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * devicePixelRatio;
      canvas.height = h * devicePixelRatio;
      ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);

      player.y = h * 0.82;
      player.x = w / 2;
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnEnemy() {
      const laneCount = 3;
      const lane = Math.floor(Math.random() * laneCount);
      const x = (w * 0.5) + (lane - 1) * (w * 0.18);
      const y = -120;
      const carW = 44;
      const carH = 80;
      const color = ['#3a86ff', '#f4d35e', '#8338ec', '#06d6a0'][Math.floor(Math.random() * 4)];
      enemies.push({ x, y, w: carW, h: carH, color, lane });
    }

    function startGame() {
      gameRunning = true;
      score = 0;
      speed = 120;
      roadScroll = 0;
      laneX = 0;
      enemies.length = 0;
      startScreen.style.display = 'none';
    }

    function update(dt) {
      if (!gameRunning) return;

      speed = Math.min(260, speed + dt * 18);
      roadScroll += speed * dt * 0.7;
      score += dt * speed * 0.18;

      laneX += moveDir * dt * 420;
      player.x += moveDir * dt * 430;

      const roadHalf = w * 0.18;
      const leftLimit = w / 2 - roadHalf + 30;
      const rightLimit = w / 2 + roadHalf - 30;
      player.x = Math.max(leftLimit, Math.min(rightLimit, player.x));

      enemyTimer -= dt;
      if (enemyTimer <= 0) {
        spawnEnemy();
        enemyTimer = Math.max(0.6, 1.2 - speed / 260);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += (speed * dt) + 40 * dt;

        if (e.y > h + 150) {
          enemies.splice(i, 1);
          continue;
        }

        const collides = Math.abs(player.x - e.x) < (player.w + e.w) * 0.55 &&
                        Math.abs(player.y - e.y) < (player.h + e.h) * 0.55;

        if (collides) {
          gameRunning = false;
          startScreen.style.display = 'flex';
          startScreen.innerHTML = '<h1>انتهت الجولة</h1><p>النقاط: ' + Math.floor(score) + '</p><button id="startBtn">إعادة اللعب</button>';
          document.getElementById('startBtn').addEventListener('click', startGame);
          speed = 0;
          return;
        }
      }

      speedEl.textContent = Math.floor(speed);
      scoreEl.textContent = Math.floor(score);
    }

    function drawRoad() {
      const centerX = w / 2;
      const roadHalf = w * 0.18;
      const horizon = h * 0.15;

      ctx.fillStyle = '#8ed36a';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#7cc36f';
      ctx.beginPath();
      ctx.moveTo(0, horizon);
      ctx.lineTo(w, horizon);
      ctx.lineTo(w, h);
      ctx.lineTo(0, h);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#3b3b3b';
      const roadWidthBase = w * 0.3;
      const roadWidthBottom = w * 0.82;
      const roadTop = horizon;
      const roadBottom = h;

      for (let y = 0; y < h; y += 22) {
        const t = (y / h);
        const width = roadWidthBase + (roadWidthBottom - roadWidthBase) * t;
        const x = centerX - width / 2;
        ctx.fillRect(x, y + (roadScroll * 0.1 % 20), width, 12);
      }

      // حواف الطريق
      ctx.strokeStyle = '#f4f4f4';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(centerX - roadWidthBase / 2, horizon);
      ctx.lineTo(centerX - roadWidthBottom / 2, h);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(centerX + roadWidthBase / 2, horizon);
      ctx.lineTo(centerX + roadWidthBottom / 2, h);
      ctx.stroke();

      // خط وسط الطريق
      ctx.strokeStyle = '#ffe66d';
      ctx.lineWidth = 4;
      for (let i = 0; i < 20; i++) {
        const y = (i * 46 + roadScroll * 0.8) % (h + 60);
        ctx.beginPath();
        ctx.moveTo(centerX, y);
        ctx.lineTo(centerX, y + 30);
        ctx.stroke();
      }
    }

    function drawCar(x, y, w, h, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      ctx.ellipse(0, h * 0.45, w * 0.62, h * 0.18, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = color;
      roundRect(ctx, -w / 2, -h / 2, w, h, 10);
      ctx.fill();

      ctx.fillStyle = '#152238';
      roundRect(ctx, -w * 0.3, -h * 0.25, w * 0.6, h * 0.36, 8);
      ctx.fill();

      ctx.fillStyle = '#f6e7b1';
      roundRect(ctx, -w * 0.25, -h * 0.48, w * 0.18, h * 0.12, 4);
      ctx.fill();
      roundRect(ctx, w * 0.07, -h * 0.48, w * 0.18, h * 0.12, 4);
      ctx.fill();

      ctx.fillStyle = '#111';
      ctx.fillRect(-w * 0.52, -h * 0.25, w * 0.14, h * 0.22);
      ctx.fillRect(w * 0.38, -h * 0.25, w * 0.14, h * 0.22);
      ctx.fillRect(-w * 0.52, h * 0.05, w * 0.14, h * 0.22);
      ctx.fillRect(w * 0.38, h * 0.05, w * 0.14, h * 0.22);

      ctx.restore();
    }

    function roundRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.moveTo(x + radius, y);
      context.arcTo(x + width, y, x + width, y + height, radius);
      context.arcTo(x + width, y + height, x, y + height, radius);
      context.arcTo(x, y + height, x, y, radius);
      context.arcTo(x, y, x + width, y, radius);
      context.closePath();
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      drawRoad();

      for (const e of enemies) {
        drawCar(e.x, e.y, e.w, e.h, e.color);
      }

      drawCar(player.x, player.y, player.w, player.h, player.color);
    }

    function frame(ts) {
      const dt = Math.min(0.04, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    function setMove(dir) {
      moveDir = dir;
    }

    leftBtn.addEventListener('pointerdown', () => setMove(-1));
    leftBtn.addEventListener('pointerup', () => setMove(0));
    leftBtn.addEventListener('pointerleave', () => setMove(0));

    rightBtn.addEventListener('pointerdown', () => setMove(1));
    rightBtn.addEventListener('pointerup', () => setMove(0));
    rightBtn.addEventListener('pointerleave', () => setMove(0));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') setMove(-1);
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') setMove(1);
    });
    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a' || e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') setMove(0);
    });

    startBtn.addEventListener('click', startGame);
    resize();
    requestAnimationFrame(frame);
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
