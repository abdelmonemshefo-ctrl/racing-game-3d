<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>سباق السيارات الواقعي</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: white;
      font-family: Arial, sans-serif;
      user-select: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(#5ab6ff, #cfe9ff 36%, #91d36c 36%, #4da35a 100%);
    }

    #hud {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      font-size: 20px;
      font-weight: bold;
      z-index: 20;
      pointer-events: none;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.7);
    }

    #startScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: rgba(0,0,0,0.4);
      z-index: 30;
    }

    #startScreen h1 {
      margin: 0 0 8px 0;
      font-size: clamp(36px, 6vw, 60px);
      letter-spacing: 1px;
    }

    #startScreen p {
      margin: 0 0 20px 0;
      font-size: clamp(16px, 3vw, 24px);
      color: #edf6ff;
    }

    #startBtn {
      border: none;
      border-radius: 18px;
      background: linear-gradient(#ff4d4d, #d11616);
      color: #fff;
      font-size: clamp(18px, 3vw, 28px);
      font-weight: bold;
      padding: 16px 26px;
      cursor: pointer;
      box-shadow: 0 8px 0 rgba(110, 10, 18, 1);
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 20px;
      display: flex;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 25;
    }

    .btn {
      width: 96px;
      height: 72px;
      border: 2px solid rgba(255,255,255,0.8);
      border-radius: 18px;
      background: rgba(0,0,0,0.34);
      color: white;
      font-size: 34px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>السرعة: <span id="speed">0</span> كم/س</div>
    <div>النقاط: <span id="score">0</span></div>
  </div>

  <div id="startScreen">
    <h1>🏁 سباق السيارات الواقعي</h1>
    <p>تجنب السيارات، حافظ على السرعة، وواصل التقدم</p>
    <button id="startBtn">ابدأ السباق</button>
  </div>

  <div id="controls">
    <button class="btn" id="leftBtn">◀</button>
    <button class="btn" id="rightBtn">▶</button>
  </div>

  <script>
    const canvas = document.createElement('canvas');
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');

    const hudSpeed = document.getElementById('speed');
    const hudScore = document.getElementById('score');
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const leftBtn = document.getElementById('leftBtn');
    const rightBtn = document.getElementById('rightBtn');

    let w = 0, h = 0;
    let running = false;
    let score = 0;
    let speed = 0;
    let roadScroll = 0;
    let moveX = 0;
    let lastTime = 0;
    let spawnTimer = 0;

    const laneCenters = [];

    const player = {
      x: 0,
      y: 0,
      w: 58,
      h: 108,
      color: '#ff4d4d'
    };

    const enemies = [];

    function resize() {
      w = window.innerWidth;
      h = window.innerHeight;
      canvas.width = w * devicePixelRatio;
      canvas.height = h * devicePixelRatio;
      ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
      player.x = w / 2;
      player.y = h * 0.82;
      rebuildLaneCenters();
    }

    function rebuildLaneCenters() {
      const roadHalf = w * 0.18;
      const center = w / 2;
      laneCenters.length = 0;
      laneCenters.push(center - roadHalf * 0.62);
      laneCenters.push(center);
      laneCenters.push(center + roadHalf * 0.62);
    }

    function rand(min, max) {
      return Math.random() * (max - min) + min;
    }

    function spawnEnemy() {
      const laneIndex = Math.floor(Math.random() * laneCenters.length);
      const x = laneCenters[laneIndex];
      const colors = ['#3a86ff', '#f4d35e', '#8338ec', '#06d6a0', '#df5b5b'];
      enemies.push({
        x,
        y: -140,
        w: 48,
        h: 88,
        color: colors[Math.floor(Math.random() * colors.length)]
      });
    }

    function startGame() {
      running = true;
      score = 0;
      speed = 130;
      roadScroll = 0;
      moveX = 0;
      enemies.length = 0;
      spawnTimer = 0.8;
      startScreen.style.display = 'none';
      hudSpeed.textContent = '0';
      hudScore.textContent = '0';
    }

    function update(dt) {
      if (!running) return;

      speed = Math.min(260, speed + dt * 14);
      roadScroll += speed * dt * 0.9;
      score += dt * speed * 0.17;

      const roadHalf = w * 0.18;
      const leftLimit = w / 2 - roadHalf * 0.72;
      const rightLimit = w / 2 + roadHalf * 0.72;

      player.x += moveX * dt * 450;
      player.x = Math.max(leftLimit, Math.min(rightLimit, player.x));

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = Math.max(0.6, 1.25 - speed / 220);
      }

      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.y += (speed * dt) + 40 * dt;

        if (e.y > h + 120) {
          enemies.splice(i, 1);
          continue;
        }

        const collides = Math.abs(player.x - e.x) < (player.w + e.w) * 0.48 &&
                         Math.abs(player.y - e.y) < (player.h + e.h) * 0.46;

        if (collides) {
          running = false;
          startScreen.style.display = 'flex';
          startScreen.innerHTML = '<h1>انتهت الجولة</h1><p>نقاطك: ' + Math.floor(score) + '</p><button id="startBtn">إعادة اللعب</button>';
          document.getElementById('startBtn').addEventListener('click', startGame);
          return;
        }
      }

      hudSpeed.textContent = Math.floor(speed);
      hudScore.textContent = Math.floor(score);
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, h * 0.5);
      sky.addColorStop(0, '#5db8ff');
      sky.addColorStop(0.7, '#cfeeff');
      sky.addColorStop(1, '#d7f7d2');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, w, h);

      // الشمس
      ctx.fillStyle = '#ffe58a';
      ctx.beginPath();
      ctx.arc(w * 0.8, h * 0.16, 42, 0, Math.PI * 2);
      ctx.fill();

      // الجبال
      ctx.fillStyle = '#6a8d6a';
      ctx.beginPath();
      ctx.moveTo(0, h * 0.38);
      ctx.lineTo(w * 0.15, h * 0.18);
      ctx.lineTo(w * 0.28, h * 0.38);
      ctx.lineTo(w * 0.45, h * 0.2);
      ctx.lineTo(w * 0.62, h * 0.38);
      ctx.lineTo(w * 0.8, h * 0.22);
      ctx.lineTo(w, h * 0.38);
      ctx.lineTo(w, h * 0.55);
      ctx.lineTo(0, h * 0.55);
      ctx.closePath();
      ctx.fill();
    }

    function drawRoad() {
      const centerX = w / 2;
      const horizon = h * 0.18;
      const roadWide = w * 0.72;
      const roadNarrow = w * 0.26;

      ctx.fillStyle = '#4d8f3f';
      ctx.fillRect(0, horizon, w, h - horizon);

      // طريق perspective
      for (let i = 0; i < 32; i++) {
        const t = i / 32;
        const y1 = horizon + t * (h - horizon);
        const y2 = horizon + (t + 0.03) * (h - horizon);
        const width1 = roadNarrow + (roadWide - roadNarrow) * t;
        const width2 = roadNarrow + (roadWide - roadNarrow) * (t + 0.03);
        ctx.fillStyle = i % 2 === 0 ? '#3f3f3f' : '#464646';
        ctx.beginPath();
        ctx.moveTo(centerX - width1 / 2, y1);
        ctx.lineTo(centerX + width1 / 2, y1);
        ctx.lineTo(centerX + width2 / 2, y2);
        ctx.lineTo(centerX - width2 / 2, y2);
        ctx.closePath();
        ctx.fill();
      }

      // إضاءة الطريق
      ctx.strokeStyle = '#d7d7d7';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(centerX - roadNarrow / 2, horizon);
      ctx.lineTo(centerX - roadWide / 2, h);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(centerX + roadNarrow / 2, horizon);
      ctx.lineTo(centerX + roadWide / 2, h);
      ctx.stroke();

      // خطوط وسط الطريق
      ctx.strokeStyle = '#ffef8a';
      ctx.lineWidth = 4;
      for (let i = 0; i < 20; i++) {
        const p = (i * 52 + (roadScroll * 1.5)) % (h + 120);
        const y = p;
        ctx.beginPath();
        ctx.moveTo(centerX, y);
        ctx.lineTo(centerX, y + 30);
        ctx.stroke();
      }

      // أضواء جانبية
      for (let i = 0; i < 12; i++) {
        const yy = (i * 80 + (roadScroll * 1.2)) % (h + 100);
        const x1 = centerX - roadWide / 2 - 18;
        const x2 = centerX + roadWide / 2 + 18;
        ctx.fillStyle = '#f5f5f5';
        ctx.fillRect(x1, yy, 10, 30);
        ctx.fillRect(x2, yy, 10, 30);
      }
    }

    function roundedRect(x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + width, y, x + width, y + height, radius);
      ctx.arcTo(x + width, y + height, x, y + height, radius);
      ctx.arcTo(x, y + height, x, y, radius);
      ctx.arcTo(x, y, x + width, y, radius);
      ctx.closePath();
    }

    function drawCar(x, y, width, height, color) {
      ctx.save();
      ctx.translate(x, y);

      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(0, height * 0.46, width * 0.6, height * 0.17, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = color;
      roundedRect(-width / 2, -height / 2, width, height, 12);
      ctx.fill();

      ctx.fillStyle = '#161d2b';
      roundedRect(-width * 0.28, -height * 0.28, width * 0.56, height * 0.32, 8);
      ctx.fill();

      ctx.fillStyle = '#f7f0b0';
      ctx.fillRect(-width * 0.22, -height * 0.5, width * 0.18, height * 0.12);
      ctx.fillRect(width * 0.04, -height * 0.5, width * 0.18, height * 0.12);

      ctx.fillStyle = '#111';
      ctx.fillRect(-width * 0.5, -height * 0.25, width * 0.14, height * 0.24);
      ctx.fillRect(width * 0.36, -height * 0.25, width * 0.14, height * 0.24);
      ctx.fillRect(-width * 0.5, height * 0.09, width * 0.14, height * 0.24);
      ctx.fillRect(width * 0.36, height * 0.09, width * 0.14, height * 0.24);

      ctx.restore();
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      drawSky();
      drawRoad();

      for (const enemy of enemies) {
        drawCar(enemy.x, enemy.y, enemy.w, enemy.h, enemy.color);
      }

      drawCar(player.x, player.y, player.w, player.h, player.color);
    }

    function animate(ts) {
      const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0.016);
      lastTime = ts;
      update(dt);
      draw();
      requestAnimationFrame(animate);
    }

    function setMove(dir) { moveX = dir; }

    leftBtn.addEventListener('pointerdown', () => setMove(-1));
    leftBtn.addEventListener('pointerup', () => setMove(0));
    leftBtn.addEventListener('pointerleave', () => setMove(0));
    rightBtn.addEventListener('pointerdown', () => setMove(1));
    rightBtn.addEventListener('pointerup', () => setMove(0));
    rightBtn.addEventListener('pointerleave', () => setMove(0));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a') setMove(-1);
      if (e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') setMove(1);
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft' || e.key.toLowerCase() === 'a' || e.key === 'ArrowRight' || e.key.toLowerCase() === 'd') {
        setMove(0);
      }
    });

    startBtn.addEventListener('click', startGame);
    resize();
    requestAnimationFrame(animate);
    window.addEventListener('resize', resize);
  </script>
</body>
</html>
